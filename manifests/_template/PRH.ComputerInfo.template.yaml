# Template used by .github/workflows/release.yml to render
# manifests/p/prh/computerinfo/<version>/PRH.ComputerInfo.yaml on each release.
# Not itself a valid winget manifest - placeholders are substituted in CI.
# Same PackageIdentifier as the WPF app, so winget treats releases from this
# repository as upgrades of the existing internal package.
PackageIdentifier: PRH.ComputerInfo
PackageVersion: __VERSION__
PackageLocale: en-US
Publisher: PRH
PackageName: PRH Computer Info
ShortDescription: Computer info desktop app for PRH IT support (Rust)
License: GPL-3.0
Installers:
  - Architecture: x64
    InstallerType: portable
    InstallerUrl: __INSTALLER_URL__
    InstallerSha256: __INSTALLER_SHA256__
    Scope: machine
ManifestType: singleton
ManifestVersion: 1.6.0
