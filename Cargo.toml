[package]
name = "computer_info"
version = "2.0.1"
edition = "2021"
rust-version = "1.85"
authors = ["PRH IT"]
description = "Displays system and printer information for IT support"
license = "GPL-3.0-only"
repository = "https://github.com/kirune/Computer_Info_RS"
homepage = "https://github.com/kirune/Computer_Info_RS"
build = "build.rs"

[[bin]]
name = "computer_info"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
